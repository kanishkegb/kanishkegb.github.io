journal:
  - title: "Delayed Kalman filter for vision-based autonomous flight in ocean environments"
    authors: "K. Gamagedara, T. Lee, M. Snyder"
    venue: "Control Engineering Practice"
    year: 2024
    doi: 10.1016/j.conengprac.2023.105791
    abstract: >
      This paper presents a delayed Kalman filter for vision-based autonomous flight
      of a UAV operating in ocean environments. The filter compensates for measurement
      delays arising from onboard image processing pipelines, enabling stable closed-loop
      control despite latency. Experimental results from flights near a US Navy research
      vessel demonstrate robust state estimation in the presence of sea spray and ship air wake.
