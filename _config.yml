title: Kanishke Gamagedara
tagline: Sensor Fusion & Navigation Engineer
description: Personal website and blog about UAVs, robotics, control systems, navigation, and embedded software engineering.
url: "https://kanishkegb.github.io"
baseurl: ""

author:
  name: Kanishke Gamagedara
  github: kanishkegb
  twitter: kanishkegb
  linkedin: kanishkegb

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: null

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Sass
sass:
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - CLAUDE.md
